name: football-prd

x-backend-environment: &backend-environment
  APP_MODE: PROD
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
  USER_SERVICE_URL: http://user-service:8081
  FIELD_SERVICE_URL: http://field-service:8082

x-prod-env-file: &prod-env-file ./common/.env-prod.properties

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football}
      POSTGRES_DB: ${POSTGRES_DB:-football}
      POSTGRES_MULTIPLE_DATABASES: user_db,field_db,booking_db,notification_db,payment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  discovery-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-discovery-service:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
    env_file: *prod-env-file
    environment:
      APP_MODE: PROD
      EUREKA_HOSTNAME: discovery-service
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/

  gateway-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-gateway-service:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - discovery-service
      - redis
    env_file: *prod-env-file
    ports:
      - "${PRD_GATEWAY_BIND:-0.0.0.0}:${PRD_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *backend-environment

  user-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-user-service:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
      - discovery-service
    env_file: *prod-env-file
    environment:
      <<: *backend-environment

  field-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-field-service:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
      - discovery-service
    env_file: *prod-env-file
    environment:
      <<: *backend-environment

  booking-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-booking-service:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis
      - discovery-service
    env_file: *prod-env-file
    environment:
      <<: *backend-environment

  notification-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-notification-service:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - discovery-service
    env_file: *prod-env-file
    environment:
      <<: *backend-environment

  payment-service:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-payment-service:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - discovery-service
    env_file: *prod-env-file
    environment:
      <<: *backend-environment

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/football-prd-frontend:${IMAGE_TAG:-1}
    restart: unless-stopped
    depends_on:
      - gateway-service
    env_file: ../frontend/.env.docker.prod
    ports:
      - "${PRD_FRONTEND_BIND:-0.0.0.0}:${PRD_FRONTEND_PORT:-3000}:3000"
    environment:
      API_BASE_URL: http://gateway-service:8080
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_GATEWAY_WS_URL: ${NEXT_PUBLIC_GATEWAY_WS_URL:-ws://localhost:8080/ws}

volumes:
  postgres_data:
