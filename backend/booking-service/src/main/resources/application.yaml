server:
  port: 8083

spring:
  config:
    import:
      - optional:file:common/.env.properties
  application:
    name: booking-service
  profiles:
    active: ${APP_MODE:dev}
    group:
      DEV: dev
      PROD: prod
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    client-id: booking-service
    admin:
      auto-create: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      client-id: booking-service-field-projection-consumer
      group-id: booking-service-field-projections
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.project.common.events.field,com.project.common.events.notification,com.project.booking.events
        spring.json.use.type.headers: true
  listener:
      ack-mode: record
      missing-topics-fatal: false
  task:
    scheduling:
      pool:
        size: 4

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

booking:
  max-booking-days-in-future: 30
  payment-timeout-minutes: 1
  recurring-payment-timeout-minutes: 30
  expiration-scheduler-fixed-delay-ms: 15000
  expiration-scheduler-jitter-ms: 3000
  completion-scheduler-fixed-delay-ms: 300000
  completion-scheduler-jitter-ms: 30000
  recurring-scheduler-fixed-delay-ms: 86400000
  recurring-scheduler-jitter-ms: 300000

community:
  post-close-scheduler-fixed-delay-ms: 1800000
  post-close-scheduler-jitter-ms: 120000
  moderation:
    permanent-ban-threshold: 3
    expiration-scheduler-fixed-delay-ms: 300000
    expiration-scheduler-jitter-ms: 30000

moderation:
  violation-recovery-jitter-ms: 300000

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:dev-internal-gateway-secret}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  field-service:
    url: ${FIELD_SERVICE_URL:http://localhost:8082}

outbox:
  batch-size: 50
  poll-interval: 1000
  scheduler-jitter-ms: 0
  max-retries: 5
  scheduler-concurrency: 8
  retry-delays:
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
  dlq:
    enabled: true
    topic-suffix: .dlq

inbox:
  batch-size: 50
  poll-interval: 1000
  scheduler-jitter-ms: 0
  max-retries: 5
  scheduler-concurrency: 1
  retry-delays:
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
