server:
  port: 8085
spring:
  config:
    import: optional:file:common/.env.properties
  application:
    name: payment-service
  profiles:
    active: ${APP_MODE:dev}
    group: { DEV: dev, PROD: prod }
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate: { ddl-auto: validate }
    properties: { hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect }
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    client-id: payment-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties: { spring.json.add.type.headers: true }
    consumer:
      client-id: payment-service-booking-consumer
      group-id: payment-service-bookings
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.project.common.events.notification
        spring.json.use.type.headers: true
    listener: { ack-mode: record, missing-topics-fatal: false }
  task:
    scheduling:
      pool:
        size: 4
eureka:
  client:
    service-url: { defaultZone: "${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}" }
  instance: { prefer-ip-address: true }
payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
internal:
  gateway: { secret: "${INTERNAL_GATEWAY_SECRET:dev-internal-gateway-secret}" }
outbox:
  batch-size: 50
  poll-interval: 1000
  max-retries: 5
  scheduler-concurrency: 8
  retry-delays: [10s, 30s, 1m, 5m, 15m]
  dlq: { enabled: true, topic-suffix: .dlq }
inbox:
  batch-size: 50
  poll-interval: 1000
  max-retries: 5
  scheduler-concurrency: 1
  retry-delays: [10s, 30s, 1m, 5m, 15m]
