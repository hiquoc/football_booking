server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:common/.env.properties
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: user-service-auth
            uri: lb://user-service
            predicates:
              - Path=/api/v1/auth/**
          - id: user-service-api
            uri: lb://user-service
            predicates:
              - Path=/api/v1/users/**
          - id: field-service-api
            uri: lb://field-service
            predicates:
              - Path=/api/v1/fields/**, /api/v1/subfields/**
          - id: booking-service-api
            uri: lb://booking-service
            predicates:
              - Path=/api/v1/bookings/**


jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
