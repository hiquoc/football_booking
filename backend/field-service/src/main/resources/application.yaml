server:
  port: 8082

spring:
  config:
    import:
      - optional:file:common/.env.properties
  application:
    name: field-service
  profiles:
    active: ${APP_MODE:dev}
    group:
      DEV: dev
      PROD: prod
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: field-service
    admin:
      auto-create: true
    producer:
      client-id: field-service-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.in.flight.requests.per.connection: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:dev-internal-gateway-secret}

outbox:
  batch-size: 50
  poll-interval: 5000
  max-retries: 5
  scheduler-concurrency: 1
  retry-delays:
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
  dlq:
    enabled: true
    topic-suffix: .dlq

inbox:
  batch-size: 50
  poll-interval: 5000
  max-retries: 5
  scheduler-concurrency: 1
  retry-delays:
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
