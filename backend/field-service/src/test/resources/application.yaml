spring:
  datasource:
    url: jdbc:h2:mem:field-service-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false

eureka:
  client:
    enabled: false

cloudinary:
  cloud_name: test-cloud
  api_key: test-key
  api_secret: test-secret

internal:
  gateway:
    secret: test-internal-gateway-secret
    enforce-secret: true
