spring:
  config:
    import:
      - optional:file:common/.env-dev.properties
  datasource:
    url: ${NOTIFICATION_DB_URL}
    username: ${NOTIFICATION_DB_USERNAME:football}
    password: ${NOTIFICATION_DB_PASSWORD:football}
  flyway:
    locations: classpath:db/migration,classpath:db/dev-migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:dev-internal-gateway-secret}
    enforce-secret: false
    allow-docs-without-secret: true
